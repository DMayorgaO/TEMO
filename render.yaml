services:
  - type: web
    name: temo-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_CA_BASE64
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AUTH_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: temo-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://api.miscelaneaolivera.com/api
      - key: VITE_APP_ENV
        value: production
      - key: VITE_SESSION_IDLE_MINUTES
        value: "30"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.miscelaneaolivera.com https://temo-api.onrender.com; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
